# The gate of the 24 module repos, in ONE place (ERPlora/pm#107).
#
# Called from each module repo with a ~10-line stub. Everything that can change — the validator,
# the Postgres image, the Node version, the timeout — lives here, so a fix reaches the 24 repos
# without 24 pull requests.
#
# WHY THIS EXISTS. On 2026-08-09 a sweep found 4 of the 24 PUBLISHED modules shipping SQL that
# Postgres cannot even PREPARE. Since ADR-0154 modules ship the `postgres` dialect only, so "does
# not prepare" means the command DOES NOT EXIST in any hub: install it and the button does nothing.
# Nothing stood between a broken merge and the marketplace — the SaaS republishes on the `push` to
# main on its own.
#
# The stub wires this to `pull_request` AND makes the release job depend on it, so the two doors a
# module can walk through — a merge, and the version bump that actually publishes — are both gated.
name: Module gate

on:
  workflow_call:
    inputs:
      path:
        description: Path of the module inside the repository.
        required: false
        type: string
        default: '.'
      pg:
        description: >
          PREPARE every declared statement against a real Postgres. ON by default and it should
          stay on: measured on the four modules that were broken, the lexical rules alone catch
          three and let the fourth through green, and the whole check costs ~2 s per module.
        required: false
        type: boolean
        default: true
      typescript:
        description: >
          Install the vitest environment so the module's `ui/**/*.test.ts` are RUN and not just
          listed (module-toolkit#74). ON by default. What it cannot supply is `@erplora/module-sdk`
          (private, unpublished): the modules that import it are reported as NOT RUN, by name —
          never as passed, and never as red.
        required: false
        type: boolean
        default: true
    secrets:
      MODULES_DEPLOY_KEYS:
        description: >
          Read-only deploy keys of the module repos (tar.gz + base64, one private key per module
          id — the same bundle ERPlora/hub uses, hub#1216). Only a module whose recipes declare
          version floors on neighbours (`flows/*.requires.json`) needs it; without it that module's
          gate is red, because its battery would otherwise skip every floor and pass
          (module-toolkit#343).
        required: false

jobs:
  validate:
    # `erplora validate` AND, since module-toolkit#50, `erplora test` — the batteries the module
    # itself carries (any `tests/**/*.test.py` or `*.test.sh` since #55) and, since #74, its
    # TypeScript tests (`ui/**/*.test.ts` under vitest + happy-dom). All auto-detected, so a module
    # without them sees no change and pays for no setup.
    name: erplora validate + test
    # The organization's own runner when `CI_RUNNER_LABEL` is set, the hosted image when it is not.
    # `vars` here resolves against the CALLING repository, so a module repo picks the runner up from
    # the org variable without a line of its own — and the `|| 'ubuntu-latest'` means that if the
    # variable is ever removed the 25 gates fall back to the hosted image instead of queueing
    # forever against a label nobody answers to.
    #
    # SECURITY. A self-hosted runner executes the pull request's code on the organization's own
    # machine, with whatever that machine can reach. It is acceptable here because these are PRIVATE
    # repositories in a small org, where opening a pull request already requires write access, and
    # because this gate is `pull_request` (never `pull_request_target`), so a fork's code never runs
    # with the base repository's secrets. Making any of these repositories public, or adding a
    # `pull_request_target` trigger, would have to be revisited BEFORE it happens.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # Generous but finite: the whole job measures under two minutes. A hung docker pull must not
    # burn the org's Actions budget (private repos are billed by the minute).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ADR-0398 (module-toolkit#101): the errors-catalog guard diffs the manifest against the
          # last `chore(release)` commit. A shallow checkout has no such commit on disk and the
          # guard would have nothing to compare with — a guard that cannot see the past passes
          # everything. The extra cost is one fetch of a small repo.
          fetch-depth: 0

      # ── `@erplora/module-sdk` en el disco del runner (ERPlora/hub#1097) ────────────────────────
      #
      # El paquete que 25 de los 26 módulos importan desde `ui/` vive en `ERPlora/hub`, privado y
      # sin publicar. Sin él, `erplora test` declaraba SIN CORRER **206 de los 245** ficheros
      # `.test.ts` de la flota (2.387 tests, en 24 de los 26 módulos) y el gate salía en VERDE en
      # 28 s. Un aviso es un verde con adorno: en `combos` mergeó un contrato que impide guardar
      # 1.250,50 € como GRATIS sin que nada en CI lo vigilara.
      #
      # 🔴 SIN `token:`, y eso es el mecanismo entero. Los secretos de organización **no llegan a
      # un repo privado** en el plan Free, así que no hay credencial con la que hacer `checkout` de
      # `ERPlora/hub` — y un PAT en 26 repos es una decisión de seguridad, no un detalle de CI. Una
      # composite action de un repo privado que comparte sus Actions con la org es la única forma
      # que GitHub resuelve sin credencial, y al resolverla **deja el repo entero en disco**. Es el
      # mismo camino por el que este `uses:` de abajo funciona, y el que module-toolkit#61/#66
      # abrió para los espejos canónicos.
      #
      # Si `ERPlora/hub` dejara de compartir sus Actions, este paso se cae en ROJO diciendo que no
      # encuentra la action — nunca se degrada a un verde con los tests sin correr.
      #
      # 🔴 `@develop`, NO `@main`, y es deliberado. El hub integra en `develop` y publica en `main`,
      # y hoy `main` va ~100 commits por detrás: su `packages/module-sdk` no lleva todavía el
      # cambio de agrupación de millares (hub#1090) contra el que los módulos ya están escritos.
      # `develop` es el SDK contra el que se desarrolla, que es lo que el gate de un PR de módulo
      # tiene que comprobar. Medido antes de elegir: con el SDK de `main` los 7 módulos más
      # cargados (135 ficheros) también pasan, así que esto NO es un parche a un rojo — es la
      # respuesta a «¿qué SDK está probando este PR?». Probar contra el SDK **publicado** en vez
      # del integrado es una política distinta y más estricta (pillaría un módulo que usa una API
      # que aún no ha salido): se decide aparte, en module-toolkit#99.
      - id: sdk
        uses: ERPlora/hub/.github/actions/module-sdk@develop

      # ── La otra mitad del par vive en el hub (ERPlora/hub#1439, #163) ─────────────────────────
      # Una batería `*.hub.test.py|sh` y su línea en `scripts/ci/module-hub-batteries.txt` del hub
      # son UN PAR, y hasta ahora solo el hub lo comprobaba: quien lo rompía mergeaba en verde y el
      # rojo salía en OTRO repo, horas después, en el push de otra persona (inventory#77 → v1.2.44
      # → 14 runs rojos, y con el crater de los 27 módulos sin ejecutarse un día entero, porque ese
      # guard corre ANTES de `cargo test`).
      #
      # Va DESPUÉS del paso `sdk` porque reutiliza su salida: el checkout del hub que ese paso ya
      # ha traído al runner es de donde se lee la lista, sin credencial y sin red. Y solo en
      # `pull_request`, que es el momento en que se puede exigir la otra edición ANTES del merge.
      - if: github.event_name == 'pull_request'
        uses: ERPlora/module-toolkit/.github/actions/check-hub-battery-pairing@main
        with:
          path: ${{ inputs.path }}
          sdk-path: ${{ steps.sdk.outputs.path }}
          base-sha: ${{ github.event.pull_request.base.sha }}

      # ── The neighbours a recipe puts a floor on (module-toolkit#343) ────────────────────────
      # `erplora test` runs the module's battery, which checks every `flows/*.requires.json` floor
      # against the neighbour's history NEXT TO the module. Without them it skipped and went green.
      # A no-op for a module without floors; red for one with floors and no bundle.
      - name: Bring the neighbours the recipes' floors name
        uses: ERPlora/module-toolkit/.github/actions/module-neighbours@main
        with:
          path: ${{ inputs.path }}
          keys: ${{ secrets.MODULES_DEPLOY_KEYS }}

      # Resolved without any token: this repository is private, but its actions are shared with the
      # organization (repo Settings → Actions → Access). Pinned to `main` on purpose — the gate is
      # meant to be the CURRENT validator, not the one that existed when the stub was written.
      - uses: ERPlora/module-toolkit/.github/actions/validate-module@main
        with:
          path: ${{ inputs.path }}
          pg: ${{ inputs.pg }}
          typescript: ${{ inputs.typescript }}
          module-sdk-path: ${{ steps.sdk.outputs.path }}

      # The runner is self-hosted and keeps `_work/` between jobs: the neighbours go even when a
      # step above failed, or the next job would find this one's clones next to its module.
      - if: always()
        uses: ERPlora/module-toolkit/.github/actions/module-neighbours@main
        with:
          path: ${{ inputs.path }}
          cleanup: 'true'
