# Tests of the validator itself — the engine of the gate that now guards the 24 module repos.
#
# TWO reasons this file exists, and the second one is not optional:
#
#  1. `module-gate.yml` turns this repository into the single point of failure of every module
#     repo's CI. A hole here is a hole in 24 gates at once, so the validator's own tests have to run
#     on every pull request.
#
#  2. `merge-pr.sh` — the only sanctioned way to merge — refuses to merge when a repo HAS workflows
#     but the pull request reports no checks ("CI is silent: outage or out of minutes"). Adding
#     `module-gate.yml`, which only answers to `workflow_call` and therefore never produces a check
#     of its own, would have deadlocked every future merge into this repository. A workflow that
#     does answer to `pull_request` is what keeps that door open.
#
# SCOPE. `npm install` is still impossible on a runner (three dependencies are `file:` paths into
# sibling checkouts that do not exist), but every PUBLIC package the suites need is installed one
# by one below, so build, dev, icons, pack, scaffold, signing and wasm now run here too
# (module-toolkit#148). The only suite left out is `pack-outfitkit-floor`: its #201 controls run
# `erplora pack`, which needs the `zip`/`unzip` binaries the self-hosted runner lacks (#389 found it,
# once the OutfitKit it used to be blamed on was installed); `test/ci-runs-every-suite.test.mjs`
# names it with that reason and fails if an excuse ever blames a package this file installs.
#
# The file list is EXPLICIT rather than a `validate-*` glob: `manifest-schema`,
# `canonical-mirrors` (module-toolkit#30/#40), `hub-mirror` (#61), `sync-hub-mirrors` (#115),
# `run-batteries` (#50), `run-vitest` (#74), `against-hub` (#110) and `gate-wiring`
# (ERPlora/hub#1097) need no dependency either — `against-hub` injects `exec`/`probe`, so it checks
# the harness that starts containers WITHOUT starting one — and leaving them out of the pattern
# would mean a vendored schema that went missing or unparseable reached the 26 module repos without
# a single check going red. (`bin-*` already covers `bin-test-batteries` and `bin-test-typescript`.)
#
# 🔴 «A new dependency-free suite belongs on this line» used to be written here as a REQUEST, and a
# request is not a check: `gate-wiring.test.mjs` was added, was green locally, and this CI ran 367
# tests without it — a test nobody executes, which is the very defect this repository keeps finding
# in other people's code. `test/ci-runs-every-suite.test.mjs` now holds the list to account: every
# suite in `test/` either appears below or is named in its `CANNOT_RUN_IN_CI` **with the reason**.
# Adding one forces a decision instead of allowing an omission.
#
# WHAT THIS CI COULD NOT CHECK, and now does (module-toolkit#61, #90). The six mirrors of
# `canonical-mirrors` need a checkout of ERPlora/hub, and `actions/checkout` cannot get one: the
# organization is on the free plan, where "organization-level secrets and variables are not
# accessible by private repositories", so `secrets.GH_PAT` never arrives and a private ERPlora/hub
# has no credential here.
#
# WHAT THE MIRRORS COVER (module-toolkit#115). Eight of them now, the widest being the hub's FROZEN
# kernel surface: `contracts/kernel/` — routes, declarative engine, WASM guest, system tables and
# the `@erplora/module-sdk` types — vendored whole into `contracts/` here, because the gate of the
# 26 module repos cannot reach a hub either. `npm run sync-mirrors` is what refreshes every vendored
# copy, and `test/sync-hub-mirrors.test.mjs` is what keeps that script from reporting a sync it did
# not do.
#
# THE ALARM NOW RINGS ON BOTH SIDES (module-toolkit#90). There IS a hub on this runner, and there
# has been since ERPlora/hub#1097: `module-sdk@develop` is a composite action of the hub, and
# GitHub resolves it WITHOUT a credential by fetching that whole repository onto the runner. The
# mirrors were skipping next to the very checkout they needed — `skipped 7`, green, on every pull
# request. The `sdk` step below now hands them that hub in `ERPLORA_HUB_DIR`, so a vendored copy
# that drifted from hub `develop` fails HERE, on the pull request that would have shipped it, and
# not only from the hub's side (`.github/actions/check-canonical-mirrors`, called by the hub's own
# `canonical-mirrors.yml`, which is the other direction and stays).
#
# What `hub-mirror` adds is the rule that makes both gates trustworthy: a hub that was DECLARED and
# is not there is an ERROR, never a skip.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node --test (validator)
    # The organization's own runner when `CI_RUNNER_LABEL` is set, the hosted image when it is not.
    # The fallback is the whole point: the variable can disappear — the runner gets reinstalled, the
    # org changes plan — and CI keeps running on GitHub's image instead of queueing forever against
    # a label nobody answers to.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner is NOT the hosted image: it carries whatever was installed on it, and
      # it KEEPS STATE between jobs. Print what is actually there before anything depends on it, so
      # a missing Docker reads as "Docker is missing" instead of as a Postgres that never became
      # ready.
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-?} os=${RUNNER_OS:-?} arch=${RUNNER_ARCH:-?} host=$(hostname)"
          echo "node=$(node --version 2>/dev/null || echo 'absent (setup-node installs it)')"
          echo "npm=$(npm --version 2>/dev/null || echo absent)"
          echo "python3=$(python3 --version 2>&1 || echo absent)"
          # The same helper the 27 module gates use (module-toolkit#138). A broken daemon here used
          # to cost one annotation with no diagnostics, and answering «is the disk full?» meant an
          # SSH session into the runner. This repository is where that helper is maintained, so it
          # is the last place that should keep a second copy of it.
          . .github/scripts/ci-infra.sh
          erplora_require_docker

      # ── ¿Sigue llegando `@erplora/module-sdk`? (ERPlora/hub#1097) ─────────────────────────────
      #
      # `module-gate.yml` monta los tests de TypeScript de los 26 módulos sobre esta action, que
      # `ERPlora/hub` comparte con la organización. Ese ajuste vive en la configuración de OTRO
      # repo, así que puede desaparecer sin que nadie toque una línea de código — y el día que pase,
      # los 26 gates se caen a la vez y con pinta de fallo de los módulos.
      #
      # Aquí se cae SOLO este repo, que es donde se lee y donde está el arreglo. Es la misma forma
      # que `check-canonical-mirrors`: la alarma, en el lado que puede oírla.
      - id: sdk
        uses: ERPlora/hub/.github/actions/module-sdk@develop

      - name: El SDK que la action promete está de verdad ahí
        run: |
          set -euo pipefail
          sdk='${{ steps.sdk.outputs.path }}'
          [ -n "$sdk" ] || { echo '::error::la action no ha devuelto ninguna ruta'; exit 1; }
          [ -f "$sdk/package.json" ] || { echo "::error::$sdk sin package.json"; exit 1; }
          echo "→ @erplora/module-sdk alcanzable en $sdk"
          # The same checkout, two levels up, IS ERPlora/hub at `develop` — that is how the action
          # resolves, and it is what lets the six canonical mirrors run here instead of skipping
          # (module-toolkit#90). Declared, never guessed: `hub-mirror.mjs` turns a declared hub it
          # cannot read into an ERROR, so a moved or renamed path fails loudly here rather than
          # switching the mirrors off and reporting green.
          hub=$(cd "$sdk/../.." && pwd)
          for canonical in schemas/module.schema.json crates/runtime/src/manifest.rs apps/web/src/main.ts contracts/kernel/routes.snapshot; do
            [ -f "$hub/$canonical" ] || {
              echo "::error::el checkout del hub ($hub) no trae $canonical — los espejos canónicos no pueden compararse contra él"
              exit 1
            }
          done
          echo "ERPLORA_HUB_DIR=$hub" >> "$GITHUB_ENV"
          echo "→ espejos canónicos contra el hub en $hub"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The battery-runner suites (module-toolkit#50) spawn a real `python3`: they SKIP themselves
      # without one, and a suite that skips on the very runner it is meant to protect is the same
      # hole it was written to close. `ci-runner-1` is a bare Ubuntu, so python is installed, never
      # assumed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Rust, for the two CONTROLS of module-toolkit#146 ────────────────────────────────────────
      #
      # `test/run-cargo.test.mjs` ends in a matched pair that runs a REAL `cargo test` over two
      # fixture handlers differing in one assertion: the healthy one must be green, the mutant one
      # must be red. Everything above them injects a fake cargo, which proves the reporting and
      # nothing about the wiring — they are the only reason to believe the gate would have caught
      # ERPlora/kitchen#63.
      #
      # 🔴 So they must not be allowed to skip. A control that skips itself on the very runner it
      # exists to protect is the disease #146 is about, wearing a passing badge — the same shape as
      # the `python3` this file installs three lines up, and as the `@ionic/core` below it. rustup's
      # own installer (minimal profile) into `$HOME/.cargo`, which persists between jobs on a
      # self-hosted runner; the fixtures declare ZERO dependencies, so nothing here reaches
      # crates.io and the controls cannot go yellow on a network blip.
      - name: Rust for the handler-test controls
        run: |
          set -euo pipefail
          if command -v cargo >/dev/null 2>&1; then
            echo "→ cargo ya presente: $(cargo --version)"
            exit 0
          fi
          . .github/scripts/ci-infra.sh
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh" \
            || erplora_infra_fail 'no se ha podido descargar el instalador de rustup'
          sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain stable --no-modify-path \
            || erplora_infra_fail 'rustup no ha podido instalar la toolchain de Rust'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Six public dependencies, installed one by one (never `npm install`, which would try to
      # resolve the three `file:` paths into sibling checkouts that do not exist on a runner).
      #
      # `@ionic/core` is here for ONE assertion, and it is the one that must not skip: the
      # `fill`/`mode="md"` guard (hub#760) reads Ionic's own CSS to prove it still has a reason to
      # exist. Letting that test skip itself for want of the package is exactly the hole of
      # module-toolkit#61 — an alarm that is silent because nobody notices it never rang.
      #
      # `ajv` is what EVALUATES the canonical manifest schema (module-toolkit#247) instead of only
      # reading its key names; without it `test/validate-*.test.mjs` dies on ERR_MODULE_NOT_FOUND.
      # This list and the module gate's are not kept in step by hand: `test/gate-wiring.test.mjs`
      # reads the validator's own import graph and fails the pull request that adds a package
      # without installing it in BOTH files.
      #
      # `esbuild`, `@iconify/utils` and `@iconify-json/ion` are what `erplora build`/`pack`/`dev`
      # import; the suites that drive them (wasm, build-entry, pack-include, signing, scaffold,
      # icons, dev-*) used to be excused as «needs esbuild» although these are public packages
      # (module-toolkit#148).
      - name: Install the public dependencies the validator needs
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/erplora-validator-deps"
          # Belt and braces: the runner wipes $RUNNER_TEMP at the start of every job (measured on
          # ci-runner-1, 2026-09-03: every idle slot holds an empty _work/_temp), so this only matters
          # if that cleanup ever fails — a scratch install must never depend on it (module-toolkit#171).
          rm -rf "$deps"
          mkdir -p "$deps" node_modules
          # `--legacy-peer-deps`: npm 10's arborist (Node 22's npm) crashes computing a peer set the day
          # a peer family bumps major on the registry — vitest 5.0.0 took the whole module CI down on
          # 2026-09-03 (module-toolkit#171). A throwaway prefix with an explicit package list needs no
          # peer resolution. Guard: test/npm-scratch-install-skips-peer-resolution.test.mjs
          for pkg in typescript @ionic/core ajv esbuild @iconify/utils @iconify-json/ion @erplora/outfitkit lit; do
            want=$(node -p "require('./package.json').dependencies['$pkg']")
            npm install --prefix "$deps" --cache "$deps/.npm-cache" --no-audit --no-fund --loglevel=error --legacy-peer-deps "$pkg@$want"
          done
          ln -sfn "$deps/node_modules/typescript" node_modules/typescript
          mkdir -p node_modules/@ionic
          ln -sfn "$deps/node_modules/@ionic/core" node_modules/@ionic/core
          # Only `ajv` itself is linked: node resolves a symlink through its realpath, so ajv's own
          # four dependencies are found next to it inside the scratch prefix.
          ln -sfn "$deps/node_modules/ajv" node_modules/ajv
          # Same trick for esbuild and @iconify/utils: esbuild's platform binary
          # (`@esbuild/<os>-<arch>`) and @iconify/utils' own dependencies are found through the
          # symlink's realpath inside the scratch prefix, same as ajv.
          ln -sfn "$deps/node_modules/esbuild" node_modules/esbuild
          mkdir -p node_modules/@iconify node_modules/@iconify-json
          ln -sfn "$deps/node_modules/@iconify/utils" node_modules/@iconify/utils
          ln -sfn "$deps/node_modules/@iconify-json/ion" node_modules/@iconify-json/ion
          # The toolkit's own OutfitKit: `validate` reads its types (validate-outfitkit-api.mjs). It is
          # never what a bundle bakes: `build` and `build --check` fetch theirs from npm into a cache
          # (module-toolkit#423), and their suites use a fake registry.
          mkdir -p node_modules/@erplora
          ln -sfn "$deps/node_modules/@erplora/outfitkit" node_modules/@erplora/outfitkit
          # The whole Lit family, not only `lit`: the resolve plugin pins every `lit*`/`@lit/*` specifier
          # to the toolkit's own copy, including the ones `lit` imports inside the bundle. `lit` is a
          # runtime dependency, so the suites may bake a real Lit component (module-toolkit#389).
          mkdir -p node_modules/@lit
          for dir in "$deps"/node_modules/lit "$deps"/node_modules/lit-* "$deps"/node_modules/@lit/*; do
            ln -sfn "$dir" "node_modules/${dir#"$deps"/node_modules/}"
          done

      - name: Start the scratch Postgres
        env:
          # One container per job, never a shared name (module-toolkit#43): `ci-runner-1` runs two
          # jobs at once and keeps Docker state between them, so a fixed name meant one job's
          # `docker rm -f` killed the other's Postgres. Only OUR name is ever removed.
          PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
          # Pinned to the major that runs in production, same as the module gate's default.
          POSTGRES_IMAGE: postgres:18
        # Through the shared helper (module-toolkit#138): a `docker run` that dies on a full disk
        # used to leave this job red with no annotation at all, which is indistinguishable from the
        # validator's own tests failing.
        run: |
          set -euo pipefail
          . .github/scripts/ci-infra.sh
          erplora_start_scratch_postgres

      # The PREPARE suites SKIP themselves when there is no container; the step above is what makes
      # them actually run. If they ever start skipping here the count drops, which is visible.
      - name: Tests
        run: >
          node --test
          test/validate-*.test.mjs
          test/contracts.test.mjs
          test/bundle-freshness.test.mjs
          test/dev-build-status.test.mjs
          test/bin-*.test.mjs
          test/manifest-schema.test.mjs
          test/canonical-mirrors.test.mjs
          test/hub-outfitkit-source.test.mjs
          test/hub-outfitkit-rows.test.mjs
          test/hub-mirror.test.mjs
          test/sync-hub-mirrors.test.mjs
          test/run-batteries.test.mjs
          test/run-vitest.test.mjs
          test/run-cargo.test.mjs
          test/against-hub.test.mjs
          test/gate-wiring.test.mjs
          test/money-display-guard.test.mjs
          test/money-input.test.mjs
          test/money-input-bundle.test.mjs
          test/check-hub-battery-pairing.test.mjs
          test/module-neighbours.test.mjs
          test/gate-infra-annotations.test.mjs
          test/release-dispatch.test.mjs
          test/scaffold-runs-on-postgres.test.mjs
          test/package-lock-in-sync.test.mjs
          test/npm-cache-isolation.test.mjs
          test/npm-scratch-dir-is-clean.test.mjs
          test/npm-scratch-install-skips-peer-resolution.test.mjs
          test/bundle-hub-sdk.test.mjs
          test/sdk-freshness.test.mjs
          test/dist-reproducible.test.mjs
          test/bundle-web-component.test.mjs
          test/check-dist-reproducible-script.test.mjs
          test/outfitkit-ci.test.mjs
          test/rebake-catalog-script.test.mjs
          test/resolve-plugin.test.mjs
          test/install-from-package.test.mjs
          test/npm-publish.test.mjs
          test/check-release-tag.test.mjs
          test/wasm.test.mjs
          test/build-entry.test.mjs
          test/dev-collect.test.mjs
          test/dev-emit-dedup-key.test.mjs
          test/dev-outfitkit.test.mjs
          test/icons.test.mjs
          test/real-module-fixtures.test.mjs
          test/outfitkit-stamp.test.mjs
          test/pack-include.test.mjs
          test/scaffold.test.mjs
          test/scaffold-view-i18n.test.mjs
          test/startproject-deps.test.mjs
          test/signing.test.mjs
          test/ci-runs-every-suite.test.mjs

      # Nobody tidies up after a job on a self-hosted runner: without this, a Postgres stays holding
      # memory on the machine. Only OUR container — never the other slot's. Best-effort on purpose.
      - name: Stop the scratch Postgres
        if: always()
        env:
          PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
