# Tests of the validator itself — the engine of the gate that now guards the 24 module repos.
#
# TWO reasons this file exists, and the second one is not optional:
#
#  1. `module-gate.yml` turns this repository into the single point of failure of every module
#     repo's CI. A hole here is a hole in 24 gates at once, so the validator's own tests have to run
#     on every pull request.
#
#  2. `merge-pr.sh` — the only sanctioned way to merge — refuses to merge when a repo HAS workflows
#     but the pull request reports no checks ("CI is silent: outage or out of minutes"). Adding
#     `module-gate.yml`, which only answers to `workflow_call` and therefore never produces a check
#     of its own, would have deadlocked every future merge into this repository. A workflow that
#     does answer to `pull_request` is what keeps that door open.
#
# SCOPE. Only the validator's tests run here: `npm install` is impossible on a runner (three
# dependencies are `file:` paths into sibling checkouts that do not exist), so the suites that need
# esbuild, lit or @ionic/core — build, dev, icons, pack, scaffold, signing, wasm-build — stay a
# local `node --test`. What runs is what the gate runs, including the real PREPARE ones, in about
# 30 seconds.
#
# The file list is EXPLICIT rather than a `validate-*` glob: `manifest-schema`,
# `canonical-mirrors` (module-toolkit#30/#40) and `run-batteries` (#50) need no dependency either,
# and leaving them out of the pattern would mean a vendored schema that went missing or
# unparseable reached the 25 module repos without a single check going red. A new
# dependency-free suite belongs on this line. (`bin-*` already covers `bin-test-batteries`.)
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node --test (validator)
    # The organization's own runner when `CI_RUNNER_LABEL` is set, the hosted image when it is not.
    # The fallback is the whole point: the variable can disappear — the runner gets reinstalled, the
    # org changes plan — and CI keeps running on GitHub's image instead of queueing forever against
    # a label nobody answers to.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A self-hosted runner is NOT the hosted image: it carries whatever was installed on it, and
      # it KEEPS STATE between jobs. Print what is actually there before anything depends on it, so
      # a missing Docker reads as "Docker is missing" instead of as a Postgres that never became
      # ready.
      - name: Runner preflight
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME:-?} os=${RUNNER_OS:-?} arch=${RUNNER_ARCH:-?} host=$(hostname)"
          echo "node=$(node --version 2>/dev/null || echo 'absent (setup-node installs it)')"
          echo "npm=$(npm --version 2>/dev/null || echo absent)"
          echo "python3=$(python3 --version 2>&1 || echo absent)"
          if ! docker info >/dev/null 2>&1; then
            echo "::error::this runner has no usable Docker, and the PREPARE suites need a scratch Postgres"
            exit 1
          fi
          echo "docker=$(docker --version)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The battery-runner suites (module-toolkit#50) spawn a real `python3`: they SKIP themselves
      # without one, and a suite that skips on the very runner it is meant to protect is the same
      # hole it was written to close. `ci-runner-1` is a bare Ubuntu, so python is installed, never
      # assumed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the single public dependency the validator needs
        run: |
          set -euo pipefail
          ts=$(node -p "require('./package.json').dependencies.typescript")
          deps="$RUNNER_TEMP/erplora-validator-deps"
          mkdir -p "$deps" node_modules
          npm install --prefix "$deps" --no-audit --no-fund --loglevel=error "typescript@$ts"
          ln -sfn "$deps/node_modules/typescript" node_modules/typescript

      - name: Start the scratch Postgres
        env:
          # One container per job, never a shared name (module-toolkit#43): `ci-runner-1` runs two
          # jobs at once and keeps Docker state between them, so a fixed name meant one job's
          # `docker rm -f` killed the other's Postgres. Only OUR name is ever removed.
          PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$PG_CONTAINER" -e POSTGRES_PASSWORD=postgres postgres:18
          echo "ERPLORA_TEST_PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if docker exec "$PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              echo "→ postgres ready in $PG_CONTAINER"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the scratch Postgres ($PG_CONTAINER) never became ready"
          exit 1

      # The PREPARE suites SKIP themselves when there is no container; the step above is what makes
      # them actually run. If they ever start skipping here the count drops, which is visible.
      - name: Tests
        run: >
          node --test
          test/validate-*.test.mjs
          test/contracts.test.mjs
          test/bin-*.test.mjs
          test/manifest-schema.test.mjs
          test/canonical-mirrors.test.mjs
          test/run-batteries.test.mjs

      # Nobody tidies up after a job on a self-hosted runner: without this, a Postgres stays holding
      # memory on the machine. Only OUR container — never the other slot's. Best-effort on purpose.
      - name: Stop the scratch Postgres
        if: always()
        env:
          PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
