# `erplora validate` as a step, for the CI gate of the 24 module repos (ERPlora/pm#107).
#
# WHY IT LIVES HERE. A module repo cannot run the validator on its own: the validator is this
# repository, it is private, and the caller's GITHUB_TOKEN cannot check out another private repo.
# A composite action is the one shape GitHub resolves WITHOUT any credential — with
# "Access: accessible from repositories in the organization" set on this repo, the runner fetches
# it the same way it fetches a public action. No PAT lives in 24 repos, and the gate always runs
# the validator that sits on this repo's `main`, so fixing a hole here fixes it everywhere at once.
#
# WHY NOT `npm install`. Three of this package's dependencies are `file:` paths into sibling
# checkouts (`../hub/packages/module-sdk`, `../hub/packages/module-types`, `../outfitkit`) that do
# not exist on a runner, so a plain install fails as a whole. `validate` needs exactly ONE public
# package — `typescript`, used by contracts.mjs to read the module's .ts — so that one is installed
# on its own, at the version this repo declares. If the validator ever grows another dependency the
# gate dies with ERR_MODULE_NOT_FOUND, loudly; it never degrades into a green.
#
# WHAT IS AND IS NOT VERIFIED. Manifest, portable SQL, migrations (including the two rules the
# runtime's `migration_guard` applies on install — module-toolkit#51), JSON schemas, ADR-0127
# contracts, bundle CSP, `dist/handler.wasm` freshness against the Rust source, and — with
# `pg: true` — a real `PREPARE` of every declared statement against Postgres. Since
# module-toolkit#50 it ALSO runs the batteries the module itself carries (`tests/*.contract.test.py`
# and `tests/*.postgres.test.py`), auto-detected: 20 of them across `services`, `staff` and
# `schedules` that until then nobody ran.
#
# Three things stay out, and they are NAMED rather than faked:
#
#   1. compiling the handler to wasm32 and `cargo test` of `handler/` — the 21 modules with a
#      handler depend on the hub's `guest-sdk` BY RELATIVE PATH and there is no checkout of
#      ERPlora/hub here; fetching one means a read token for a private repo living in 25 repos,
#      which is a security decision, not a CI detail. The validator says it out loud
#      ("handler WASM SIN VERIFICAR");
#   2. the vitest component tests — the `.test.ts` files DO live in the module repo, but vitest,
#      `happy-dom`, `@erplora/outfitkit` and `@erplora/module-sdk` are devDependencies of
#      `modules-workspace`, and the last two are `file:` paths into sibling checkouts that do not
#      exist on a runner;
#   3. nothing else. A battery that skips ITSELF (every `*.postgres.test.py` exits 0 when it cannot
#      reach Postgres) is reported as a FAILURE here, never as a pass.
name: Validate an ERPlora module
description: Runs `erplora validate` (manifest + SQL + contracts, optionally PREPARE against Postgres) on a module checkout.

inputs:
  path:
    description: Path of the module (the directory holding module.json).
    required: false
    default: '.'
  pg:
    description: >
      'true' to also PREPARE every declared statement against a real Postgres (`--pg`). This is the
      only door that catches SQL no lexical rule can see (a TEXT column compared with a
      timestamptz), which is how whatsapp_inbox shipped a dead command. Without Postgres reachable
      the validator FAILS saying nothing was checked — it never passes in silence.
    required: false
    default: 'true'
  postgres-image:
    description: Postgres image for the scratch database. Pinned to the major that runs in production.
    required: false
    default: 'postgres:18'
  node-version:
    description: Node version used to run the validator.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the single public dependency the validator needs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        toolkit=$(cd "$ACTION_PATH/../../.." && pwd)
        # The version comes from the toolkit's own package.json: the gate cannot drift from the
        # validator it runs.
        ts=$(node -p "require('$toolkit/package.json').dependencies.typescript")
        deps="$RUNNER_TEMP/erplora-validator-deps"
        mkdir -p "$deps"
        # Installed in a scratch prefix on purpose: installing INTO the toolkit would reify its
        # whole tree, `file:` dependencies included, and fail.
        npm install --prefix "$deps" --no-audit --no-fund --loglevel=error "typescript@$ts"
        mkdir -p "$toolkit/node_modules"
        # ESM ignores NODE_PATH, so the package has to be physically resolvable from the toolkit.
        ln -sfn "$deps/node_modules/typescript" "$toolkit/node_modules/typescript"
        echo "ERPLORA_TOOLKIT=$toolkit" >> "$GITHUB_ENV"

    - name: Start the scratch Postgres
      if: inputs.pg == 'true'
      shell: bash
      env:
        # ONE container per job, never a shared name (module-toolkit#43). `ci-runner-1` runs two
        # jobs at once and keeps its Docker state between them: with the fixed name
        # `erplora-test-pg-5433`, the second job's `docker rm -f` killed the first job's Postgres
        # under its feet — and that surfaced as "the container name is already in use", as
        # "could not create the scratch DB", or (the dangerous one) as "the migration does not
        # apply", pinned on a module whose SQL was fine. `run_id` + `run_attempt` is unique per
        # job attempt across the whole org, so nothing is shared and nothing gets removed but our
        # own. No port is published (`docker exec` is the transport), so ports cannot collide.
        PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
      run: |
        set -euo pipefail
        if ! docker info >/dev/null 2>&1; then
          echo '::error::this runner has no usable Docker, so validate --pg cannot PREPARE anything'
          exit 1
        fi
        # Only OUR name is ever removed. A re-run of the same attempt cannot happen, so this only
        # matters if a previous step of this very job left one behind; another job's container is
        # never touched.
        docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
        docker run -d --name "$PG_CONTAINER" \
          -e POSTGRES_PASSWORD=postgres \
          "$POSTGRES_IMAGE"
        # The validator reads the container from this variable (`defaultContainer()` in
        # src/validate-prepare.mjs); without it it would look for the old fixed name.
        echo "ERPLORA_TEST_PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
        for _ in $(seq 1 60); do
          if docker exec "$PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
            echo "→ postgres ready in $PG_CONTAINER"
            exit 0
          fi
          sleep 1
        done
        echo "::error::the scratch Postgres ($PG_CONTAINER) never became ready — infrastructure, not the module"
        docker logs "$PG_CONTAINER" 2>&1 | tail -20 || true
        exit 1

    - name: erplora validate
      shell: bash
      run: |
        set -euo pipefail
        flags=()
        if [ "${{ inputs.pg }}" = "true" ]; then flags+=(--pg); fi
        node "$ERPLORA_TOOLKIT/bin/erplora.mjs" validate "${{ inputs.path }}" "${flags[@]}"

    # ── The module's OWN batteries (module-toolkit#50) ───────────────────────────────────────────
    #
    # `services`, `staff` and `schedules` carry 20 batteries between them — contract checks and
    # real-Postgres checks — that until now NOBODY ran: the gate stopped at `erplora validate`. They
    # were written, they passed locally, and a change that broke one merged green.
    #
    # Auto-detected: a module with no `tests/*.test.py` gets these three steps as no-ops.
    - name: Detect the module's own batteries
      id: batteries
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.path }}"
        n=$(ls "$dir"/tests/*.contract.test.py "$dir"/tests/*.postgres.test.py 2>/dev/null | wc -l | tr -d ' ')
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "→ $n battery file(s) in $dir/tests"

    # Only when there is something to run: 22 of the 25 modules carry none, and neither
    # `setup-python` nor the venv should cost them a second.
    - uses: actions/setup-python@v5
      if: steps.batteries.outputs.count != '0'
      with:
        python-version: '3.12'

    - name: Python for the batteries (a venv with jsonschema)
      if: steps.batteries.outputs.count != '0'
      shell: bash
      run: |
        set -euo pipefail
        # `tests/schemas.contract.test.py` NEEDS `jsonschema` and REFUSES to skip without it
        # («skipping would turn a validation test into a green light for nothing»). A venv is the
        # deterministic way to hand it one without touching the 25 module repos and without
        # depending on whatever the self-hosted runner happens to carry — which is nothing: it is a
        # bare Ubuntu.
        venv="$RUNNER_TEMP/erplora-batteries"
        python3 -m venv "$venv"
        "$venv/bin/pip" install --quiet --disable-pip-version-check jsonschema
        echo "ERPLORA_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

    - name: erplora test (the module's own batteries)
      if: steps.batteries.outputs.count != '0'
      shell: bash
      run: |
        set -euo pipefail
        # `ERPLORA_TEST_PG_CONTAINER` was exported by the Postgres step above; with `pg: false`
        # there is none, and the Postgres batteries are reported as NOT RUN rather than as passed.
        # That distinction is the whole point: every `*.postgres.test.py` exits 0 when it cannot
        # reach the container, so "green" and "did not run" look identical from the outside.
        node "$ERPLORA_TOOLKIT/bin/erplora.mjs" test "${{ inputs.path }}"

    # Nobody tidies up after a job on a self-hosted runner: without this a Postgres per gate run
    # would stay holding memory on the machine. Only OUR container (the one this job named), so a
    # job that dies never takes the other slot's Postgres with it. Best-effort.
    - name: Stop the scratch Postgres
      if: always() && inputs.pg == 'true'
      shell: bash
      env:
        PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
      run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
