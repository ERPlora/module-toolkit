# `erplora validate` as a step, for the CI gate of the 24 module repos (ERPlora/pm#107).
#
# WHY IT LIVES HERE. A module repo cannot run the validator on its own: the validator is this
# repository, it is private, and the caller's GITHUB_TOKEN cannot check out another private repo.
# A composite action is the one shape GitHub resolves WITHOUT any credential — with
# "Access: accessible from repositories in the organization" set on this repo, the runner fetches
# it the same way it fetches a public action. No PAT lives in 24 repos, and the gate always runs
# the validator that sits on this repo's `main`, so fixing a hole here fixes it everywhere at once.
#
# WHY NOT `npm install`. Three of this package's dependencies are `file:` paths into sibling
# checkouts (`../hub/packages/module-sdk`, `../hub/packages/module-types`, `../outfitkit`) that do
# not exist on a runner, so a plain install fails as a whole. `validate` needs exactly ONE public
# package — `typescript`, used by contracts.mjs to read the module's .ts — so that one is installed
# on its own, at the version this repo declares. If the validator ever grows another dependency the
# gate dies with ERR_MODULE_NOT_FOUND, loudly; it never degrades into a green.
#
# WHAT IS AND IS NOT VERIFIED. Manifest, portable SQL, migrations (including the two rules the
# runtime's `migration_guard` applies on install — module-toolkit#51), JSON schemas, ADR-0127
# contracts, bundle CSP, `dist/handler.wasm` freshness against the Rust source, and — with
# `pg: true` — a real `PREPARE` of every declared statement against Postgres. Since
# module-toolkit#50 it ALSO runs the batteries the module itself carries, auto-detected: 20 of them
# across `services`, `staff` and `schedules` that until then nobody ran — and since #55 ANY
# `tests/**/*.test.py|.sh`, because recognising a battery by two exact suffixes left another 20
# files in 7 modules invisible (`customers` and three more spell it `.pg.`, `cash_register` uses no
# family suffix at all, `taxes` writes two of its batteries in bash). A `.py`/`.sh` left in `tests/`
# that nothing will execute FAILS the gate by name: a test nobody runs is worse than no test.
#
# And since module-toolkit#74 the module's TYPESCRIPT tests too — `ui/**/*.test.ts`, run under
# vitest + happy-dom, which is where nearly all of the screen logic lives. 210 files across the 25
# repos and the gate ran ZERO of them: written, green on the author's machine, and breaking one
# merged green. The same net applies backwards: a `.test.ts` (or `.spec.ts`) that no pattern picks
# up FAILS the gate rather than disappearing.
#
# Three things stay out, and they are NAMED rather than faked:
#
#   1. compiling the handler to wasm32 and `cargo test` of `handler/` — the 21 modules with a
#      handler depend on the hub's `guest-sdk` BY RELATIVE PATH and there is no checkout of
#      ERPlora/hub here; fetching one means a read token for a private repo living in 25 repos,
#      which is a security decision, not a CI detail. The validator says it out loud
#      ("handler WASM SIN VERIFICAR");
#   2. `@erplora/module-sdk`, and with it MOST of the TypeScript tests — see below. Since
#      module-toolkit#74 this action DOES install the vitest environment and `erplora test` DOES
#      run `ui/**/*.test.ts`; what is still out of reach is that one package, which lives in the
#      PRIVATE ERPlora/hub and is not published to npm. The tests that need it are reported as NOT
#      RUN, by name and with the reason, never as passed;
#   3. nothing else. A battery that skips ITSELF (every `*.postgres.test.py` exits 0 when it cannot
#      reach Postgres) is reported as a FAILURE here, never as a pass.
name: Validate an ERPlora module
description: Runs `erplora validate` (manifest + SQL + contracts, optionally PREPARE against Postgres) on a module checkout.

inputs:
  path:
    description: Path of the module (the directory holding module.json).
    required: false
    default: '.'
  pg:
    description: >
      'true' to also PREPARE every declared statement against a real Postgres (`--pg`). This is the
      only door that catches SQL no lexical rule can see (a TEXT column compared with a
      timestamptz), which is how whatsapp_inbox shipped a dead command. Without Postgres reachable
      the validator FAILS saying nothing was checked — it never passes in silence.
    required: false
    default: 'true'
  postgres-image:
    description: Postgres image for the scratch database. Pinned to the major that runs in production.
    required: false
    default: 'postgres:18'
  typescript:
    description: >
      'true' to also install the vitest environment so `erplora test` can run the module's
      TypeScript tests (`ui/**/*.test.ts`). ON by default and it should stay on: a step that never
      runs is a step that does not work, and the install is skipped outright for a module that
      carries no `.test.ts`. What it CANNOT supply is `@erplora/module-sdk` — private, unpublished
      (ERPlora/hub#1097) — and the toolkit reports the tests that need it as NOT RUN, by name. Set
      to 'false' to skip the install entirely.
    required: false
    default: 'true'
  module-sdk-path:
    description: >
      Absolute path of `@erplora/module-sdk` on this runner, handed over by
      `ERPlora/hub/.github/actions/module-sdk` (ERPlora/hub#1097). It is the one package the gate
      cannot install from npm — it lives in the PRIVATE ERPlora/hub — and 25 of the 26 modules
      import it from `ui/`. Empty means "not supplied", and a module with `.test.ts` then FAILS
      rather than being reported as not run: a test nobody executes is worse than no test.
    required: false
    default: ''
  node-version:
    description: Node version used to run the validator.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the single public dependency the validator needs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        toolkit=$(cd "$ACTION_PATH/../../.." && pwd)
        # The version comes from the toolkit's own package.json: the gate cannot drift from the
        # validator it runs.
        ts=$(node -p "require('$toolkit/package.json').dependencies.typescript")
        deps="$RUNNER_TEMP/erplora-validator-deps"
        mkdir -p "$deps"
        # Installed in a scratch prefix on purpose: installing INTO the toolkit would reify its
        # whole tree, `file:` dependencies included, and fail.
        npm install --prefix "$deps" --no-audit --no-fund --loglevel=error "typescript@$ts"
        mkdir -p "$toolkit/node_modules"
        # ESM ignores NODE_PATH, so the package has to be physically resolvable from the toolkit.
        ln -sfn "$deps/node_modules/typescript" "$toolkit/node_modules/typescript"
        echo "ERPLORA_TOOLKIT=$toolkit" >> "$GITHUB_ENV"

    - name: Start the scratch Postgres
      if: inputs.pg == 'true'
      shell: bash
      env:
        # ONE container per job, never a shared name (module-toolkit#43). `ci-runner-1` runs two
        # jobs at once and keeps its Docker state between them: with the fixed name
        # `erplora-test-pg-5433`, the second job's `docker rm -f` killed the first job's Postgres
        # under its feet — and that surfaced as "the container name is already in use", as
        # "could not create the scratch DB", or (the dangerous one) as "the migration does not
        # apply", pinned on a module whose SQL was fine. `run_id` + `run_attempt` is unique per
        # job attempt across the whole org, so nothing is shared and nothing gets removed but our
        # own. No port is published (`docker exec` is the transport), so ports cannot collide.
        PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
        POSTGRES_IMAGE: ${{ inputs.postgres-image }}
      run: |
        set -euo pipefail
        if ! docker info >/dev/null 2>&1; then
          echo '::error::this runner has no usable Docker, so validate --pg cannot PREPARE anything'
          exit 1
        fi
        # Only OUR name is ever removed. A re-run of the same attempt cannot happen, so this only
        # matters if a previous step of this very job left one behind; another job's container is
        # never touched.
        docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
        docker run -d --name "$PG_CONTAINER" \
          -e POSTGRES_PASSWORD=postgres \
          "$POSTGRES_IMAGE"
        # The validator reads the container from this variable (`defaultContainer()` in
        # src/validate-prepare.mjs); without it it would look for the old fixed name.
        echo "ERPLORA_TEST_PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
        for _ in $(seq 1 60); do
          if docker exec "$PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
            echo "→ postgres ready in $PG_CONTAINER"
            exit 0
          fi
          sleep 1
        done
        echo "::error::the scratch Postgres ($PG_CONTAINER) never became ready — infrastructure, not the module"
        docker logs "$PG_CONTAINER" 2>&1 | tail -20 || true
        exit 1

    - name: erplora validate
      shell: bash
      run: |
        set -euo pipefail
        flags=()
        if [ "${{ inputs.pg }}" = "true" ]; then flags+=(--pg); fi
        node "$ERPLORA_TOOLKIT/bin/erplora.mjs" validate "${{ inputs.path }}" "${flags[@]}"

    # ── The module's OWN batteries (module-toolkit#50, widened by #55) ───────────────────────────
    #
    # Modules carry batteries — contract checks and real-Postgres checks — that until #50 NOBODY
    # ran: the gate stopped at `erplora validate`. They were written, they passed locally, and a
    # change that broke one merged green. #55 is the same hole one layer down: the discovery only
    # matched two exact suffixes, so 20 more files in 7 modules stayed invisible.
    #
    # Auto-detected: a module with no battery gets the Python setup as a no-op.
    - name: Detect the module's own batteries
      id: batteries
      shell: bash
      run: |
        set -euo pipefail
        # 🔴 module-toolkit#55: this used to be an `ls` of the two exact suffixes — a SECOND
        # implementation of the discovery rule, written in YAML, that drifted from the toolkit's
        # the moment somebody named a file `.pg.test.py`. It asks the toolkit now, so there is one
        # rule and the gate cannot disagree with the command it is about to run.
        files=$(node "$ERPLORA_TOOLKIT/bin/erplora.mjs" test "${{ inputs.path }}" --list)
        n=$(printf '%s' "$files" | grep -c . || true)
        # Split by family: the Python venv and the node packages cost real seconds each, and most
        # modules need one of the two and not the other. A module with only `.test.ts` must not pay
        # for `setup-python`, and one with only `tests/*.py` must not pay for an `npm install`.
        py=$(printf '%s\n' "$files" | grep -cE '\.(py|sh)$' || true)
        ts=$(printf '%s\n' "$files" | grep -cE '\.test\.ts$' || true)
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "python=$py" >> "$GITHUB_OUTPUT"
        echo "typescript=$ts" >> "$GITHUB_OUTPUT"
        echo "→ $n test file(s) in ${{ inputs.path }}: $py battery(ies), $ts TypeScript"
        printf '%s\n' "$files"

    # Only when there is a PYTHON/SHELL battery to run: 22 of the 25 modules carry none, and
    # neither `setup-python` nor the venv should cost them a second. (Before module-toolkit#74 this
    # read the total, which was the same number; now that `--list` also carries the `.test.ts`, a
    # module with only those would have installed a venv it never uses.)
    - uses: actions/setup-python@v5
      if: steps.batteries.outputs.python != '0'
      with:
        python-version: '3.12'

    - name: Python for the batteries (a venv with jsonschema)
      if: steps.batteries.outputs.python != '0'
      shell: bash
      run: |
        set -euo pipefail
        # `tests/schemas.contract.test.py` NEEDS `jsonschema` and REFUSES to skip without it
        # («skipping would turn a validation test into a green light for nothing»). A venv is the
        # deterministic way to hand it one without touching the 25 module repos and without
        # depending on whatever the self-hosted runner happens to carry — which is nothing: it is a
        # bare Ubuntu.
        venv="$RUNNER_TEMP/erplora-batteries"
        python3 -m venv "$venv"
        "$venv/bin/pip" install --quiet --disable-pip-version-check jsonschema
        echo "ERPLORA_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

    # ── The vitest environment for the module's TypeScript tests (module-toolkit#74) ─────────────
    #
    # `ui/**/*.test.ts` is where nearly all of the screen logic is checked — 210 files across the 25
    # repos, and until this the gate ran none of them. Running them needs five packages. Four are
    # public and are installed here; the fifth is not, and that is said out loud rather than faked:
    #
    #   vitest · happy-dom · lit · @ionic/core ·
    #   @erplora/outfitkit                              → npm, installed below
    #   @erplora/module-sdk                             → ERPlora/hub/packages/module-sdk. PRIVATE
    #                                                     repo, not published. `secrets.GH_PAT`
    #                                                     never reaches a private repository on the
    #                                                     free plan (same wall as ci.yml), so there
    #                                                     is no credential to check the hub out with.
    #                                                     Publishing it is ERPlora/hub#1097; adding
    #                                                     it below is then a one-line change.
    #
    # 🔴 WHY THE STEP RUNS ANYWAY, with 23 of the 25 modules importing the missing one. Measured
    # before deciding: without the SDK vitest does not say "the environment is incomplete", it
    # reports a resolution error per file — 6 of the 8 files of `taxes`, 51 of the 53 of `sales` —
    # which reads exactly like 51 broken tests. So the toolkit checks the packages BEFORE spawning
    # and reports those modules as NOT RUN, named, gate green. Measured on the 25 repos: 35 of the
    # 211 files DO run today (`flows` 26, `appointments` 9 — they never import the SDK), and 176 are
    # named as not run. What the step buys is that the machinery is exercised on every run instead
    # of sitting dark until somebody flips it, and the day the SDK is installable the other 176
    # light up with one line added below.
    #
    # Skipped outright for a module with no `.test.ts`, so it costs those nothing.
    - name: Node packages for the module's TypeScript tests
      if: inputs.typescript == 'true' && steps.batteries.outputs.typescript != '0'
      shell: bash
      run: |
        set -euo pipefail
        mod=$(cd "${{ inputs.path }}" && pwd)
        # Versions come from the MODULE's own package.json, so the gate cannot drift from what the
        # author develops against — except where that file says `workspace:*`, a specifier that
        # means "whatever the dev workspace has" and resolves to nothing off it. There, and only
        # there, the fallback applies.
        ver() {
          node -e '
            // `node -e` puts the user arguments straight after argv[0]: there is no script path.
            const [, manifest, name, fallback] = process.argv;
            let declared = {};
            try {
              const p = require(manifest);
              declared = { ...p.dependencies, ...p.devDependencies };
            } catch { /* a module without package.json takes the fallbacks */ }
            const v = declared[name];
            process.stdout.write(v && /^[~^]?[0-9]/.test(v) ? v : fallback);
          ' "$mod/package.json" "$1" "$2"
        }
        deps="$RUNNER_TEMP/erplora-module-ui-deps"
        mkdir -p "$deps"
        # A scratch prefix, never the module itself: `npm install` inside the module would try to
        # resolve its `workspace:*` dependencies and fail as a whole.
        #
        # `@ionic/core` is imported by nothing: `ui/lib/ionic-fill-needs-md.test.ts` (the mirror of
        # hub#760 that `inventory`, `pricing` and `staff` carry) reads Ionic's own CSS through
        # `require.resolve`, to prove the rule it enforces still has a reason to exist. Without it
        # those three modules are red on «Cannot find module», not on their own logic.
        npm install --prefix "$deps" --no-audit --no-fund --loglevel=error \
          "vitest@$(ver vitest ^4.1.10)" \
          "happy-dom@$(ver happy-dom ^20.0.0)" \
          "lit@$(ver lit ^3.2.0)" \
          "@ionic/core@$(ver @ionic/core ^8.8.0)" \
          "@erplora/outfitkit@$(ver @erplora/outfitkit latest)"
        # ESM ignores NODE_PATH, so the packages have to be physically resolvable from the module.
        mkdir -p "$mod/node_modules/@erplora" "$mod/node_modules/@ionic"
        for pkg in vitest happy-dom lit; do
          ln -sfn "$deps/node_modules/$pkg" "$mod/node_modules/$pkg"
        done
        ln -sfn "$deps/node_modules/@ionic/core" "$mod/node_modules/@ionic/core"
        ln -sfn "$deps/node_modules/@erplora/outfitkit" "$mod/node_modules/@erplora/outfitkit"
        # ── The fifth package, the one npm cannot give (ERPlora/hub#1097) ────────────────────────
        #
        # A DIRECTORY, not a tarball: `@erplora/module-sdk` declares `"main": "src/index.ts"` and is
        # consumed as TypeScript source — vitest transpiles it. So the link is the whole install:
        # no build, no version, no registry, and no second copy that can quietly fall behind the
        # hub. Measured: with it in place the 245 `.test.ts` of the 26 modules run, 26/26 green.
        #
        # 🔴 An empty path is a FAILURE, not a skip. This step only runs for a module that HAS
        # `.test.ts`; if it got here without an SDK the tests cannot run, and `erplora test` would
        # be the one to say so — but it would say it about the module, and the module is not what
        # broke. Failing here names the real culprit: the gate's own wiring.
        sdk="${{ inputs.module-sdk-path }}"
        if [ -z "$sdk" ]; then
          echo '::error::este módulo tiene tests de TypeScript y el gate no ha recibido `module-sdk-path`: sin `@erplora/module-sdk` no se pueden ejecutar. Lo entrega `ERPlora/hub/.github/actions/module-sdk` desde module-gate.yml (ERPlora/hub#1097)'
          exit 1
        fi
        if [ ! -f "$sdk/package.json" ]; then
          echo "::error::module-sdk-path apunta a $sdk y ahí no hay package.json"
          exit 1
        fi
        ln -sfn "$sdk" "$mod/node_modules/@erplora/module-sdk"
        # The door the toolkit reads, so the gate runs the vitest IT installed and never whatever a
        # self-hosted runner happens to carry from a previous job. Same shape as `ERPLORA_PYTHON`.
        echo "ERPLORA_VITEST=$deps/node_modules/vitest/vitest.mjs" >> "$GITHUB_ENV"

    # ALWAYS, with no `if:` — including on the modules that carry no battery at all. Without the
    # container the Postgres batteries cost nothing (they are reported as NOT RUN, not run), and a
    # `tests/` holding nothing but an invisible check is precisely the case a `count != 0` guard
    # would skip: it has zero batteries by definition (module-toolkit#55).
    - name: erplora test (the module's own batteries + TypeScript tests)
      shell: bash
      run: |
        set -euo pipefail
        # `ERPLORA_TEST_PG_CONTAINER` was exported by the Postgres step above; with `pg: false`
        # there is none, and the Postgres batteries are reported as NOT RUN rather than as passed.
        # That distinction is the whole point: every `*.postgres.test.py` exits 0 when it cannot
        # reach the container, so "green" and "did not run" look identical from the outside.
        node "$ERPLORA_TOOLKIT/bin/erplora.mjs" test "${{ inputs.path }}"

    # Nobody tidies up after a job on a self-hosted runner: without this a Postgres per gate run
    # would stay holding memory on the machine. Only OUR container (the one this job named), so a
    # job that dies never takes the other slot's Postgres with it. Best-effort.
    - name: Stop the scratch Postgres
      if: always() && inputs.pg == 'true'
      shell: bash
      env:
        PG_CONTAINER: erplora-test-pg-${{ github.run_id }}-${{ github.run_attempt }}
      run: docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
