# The mirrors' alarm, as a step the HUB can run on itself (module-toolkit#61).
#
# WHY IT RUNS FROM THE HUB AND NOT FROM HERE. The toolkit copies several things by hand out of
# ERPlora/hub, and `test/canonical-mirrors.test.mjs` compares them byte for byte. That test needs a
# hub checkout, and this repository's CI has none — nor can it get one: the org is on the free plan,
# where "organization-level secrets and variables are not accessible by private repositories", so
# `secrets.GH_PAT` does not reach here and `actions/checkout` of a private ERPlora/hub has no
# credential. A repo-level read token living in the repositories that need it is a security
# decision, not a CI detail (the same reasoning `validate-module` already writes down for the
# handler's wasm build).
#
# So the alarm moved to the side that HAS the hub. The divergence can only be introduced by editing
# the hub, and the hub's CI checks the hub out anyway — the one thing it lacked was the toolkit's
# vendored copy, and a composite action is exactly the shape GitHub resolves WITHOUT any credential
# when this repository's Actions are shared with the organization (`access_level: organization`,
# already set — it is how 24 module repos run `validate-module`). The runner fetches this whole
# repository to run the action, which is what puts the vendored copy on disk.
#
# WHAT IT COSTS. About ten seconds, and only on a pull request that touches one of the mirrored
# files — the caller path-filters it. Compare with what it replaces: nothing. Before this, every
# run of the mirrors reported `pass 0 · fail 0 · skipped 7` and went green, and the machine where
# the divergence is actually born was never asked a single question.
name: Check the ERPlora canonical mirrors
description: >
  Fails when a canonical source of ERPlora/hub (manifest schema, BRIDGE_FUNCTIONS, the unknown-key
  severity policy, CORE_QUERIES, the grandfathered migrations, the Ionic `ios` pin, and the FROZEN
  kernel surface of `contracts/kernel/`) has moved on while the module-toolkit's vendored copy has
  not. Run it FROM the hub, on a hub checkout.

inputs:
  hub-dir:
    description: >
      The ERPlora/hub checkout to compare against. Defaults to the caller's workspace, which is the
      hub itself when this action is used from the hub's own workflow.
    required: false
    default: ${{ github.workspace }}
  node-version:
    description: Node version used to run the mirrors.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # `npm install` is impossible here for the same reason it is in `validate-module`: three of this
    # package's dependencies are `file:` paths into sibling checkouts that do not exist on a runner.
    # The mirrors need exactly ONE public package — `typescript`, which `contracts.mjs` uses to read
    # a module's .ts — and it is installed on its own, at the version this repository declares.
    - name: Install the single public dependency the mirrors need
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        toolkit=$(cd "$ACTION_PATH/../../.." && pwd)
        ts=$(node -p "require('$toolkit/package.json').dependencies.typescript")
        deps="$RUNNER_TEMP/erplora-mirror-deps"
        # Belt and braces: the runner wipes $RUNNER_TEMP at the start of every job (measured on
        # ci-runner-1, 2026-09-03: every idle slot holds an empty _work/_temp), so this only matters
        # if that cleanup ever fails — a scratch install must never depend on it (module-toolkit#171).
        rm -rf "$deps"
        mkdir -p "$deps"
        # `--legacy-peer-deps`: npm 10's arborist (Node 22's npm) crashes computing a peer set the day
        # a peer family bumps major on the registry — vitest 5.0.0 took the whole module CI down on
        # 2026-09-03 (module-toolkit#171). A throwaway prefix with an explicit package list needs no
        # peer resolution. Guard: test/npm-scratch-install-skips-peer-resolution.test.mjs
        npm install --prefix "$deps" --cache "$deps/.npm-cache" --no-audit --no-fund --loglevel=error --legacy-peer-deps "typescript@$ts"
        mkdir -p "$toolkit/node_modules"
        # ESM ignores NODE_PATH, so the package has to be physically resolvable from the toolkit.
        ln -sfn "$deps/node_modules/typescript" "$toolkit/node_modules/typescript"
        echo "ERPLORA_TOOLKIT=$toolkit" >> "$GITHUB_ENV"

    # The tags the caller's own checkout flattened, put back (module-toolkit#201). `actions/checkout`
    # resolves a tag ref to `github.sha` and forces the COMMIT into `refs/tags/<tag>`, over the
    # annotated object — so `%(creatordate)` stops meaning "when the tag was cut" and starts meaning
    # "when the commit was made". `HUB_OUTFITKIT` is dated by the first, which is when the image was
    # built, so without this the mirror judges a correct table against the wrong clock: it is what
    # turned the `v1.1.22` release red. It runs HERE and not in the caller because this action is the
    # only side that knows the tags are what it is about to read.
    - name: The hub's real tags, back before anything reads them
      shell: bash
      env:
        ERPLORA_HUB_DIR: ${{ inputs.hub-dir }}
      run: |
        set -euo pipefail
        "$ERPLORA_TOOLKIT/scripts/restore-hub-tags.sh" "$ERPLORA_HUB_DIR"

    # The rows the hub released and the table lacks, derived and PRINTED before anything judges
    # them (module-toolkit#271): the same rule the mirror re-runs, so the warning carries the exact
    # row to paste — `npm run hub-outfitkit-rows -- --write` in the toolkit writes it. Never a
    # failure by itself: npm unreachable is an honest «could not derive», and the mirrors below are
    # the verdict.
    - name: The HUB_OUTFITKIT rows this hub's releases need
      shell: bash
      env:
        ERPLORA_HUB_DIR: ${{ inputs.hub-dir }}
      run: |
        set -uo pipefail
        node "$ERPLORA_TOOLKIT/scripts/hub-outfitkit-rows.mjs" --hub "$ERPLORA_HUB_DIR" \
          || echo "::warning::could not derive the HUB_OUTFITKIT rows of this hub (see above); the mirrors below still judge the table"

    # `ERPLORA_HUB_DIR` is DECLARED here on purpose. That is what makes a missing or misspelled hub
    # an error instead of a skip (`test/hub-mirror.mjs`): if this step could not read the hub it
    # would otherwise switch every comparison off and still report green — the precise failure
    # module-toolkit#61 was opened about.
    - name: The canonical mirrors, against this hub
      shell: bash
      env:
        ERPLORA_HUB_DIR: ${{ inputs.hub-dir }}
        # A release the table has no row for yet is the COPY lagging behind the hub, and on a hub
        # pull request that is not the PR's fault: five releases in a row (1.1.15 → 1.1.29) turned
        # every hub PR red until somebody wrote the row by hand (module-toolkit#271). There it is a
        # warning — the step above printed the row. Anywhere else (the tag job of `build-hub.yml`,
        # which is where the row falls due) it stays a failure. A WRONG row fails everywhere.
        ERPLORA_HUB_ROW_LAG: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}
      run: |
        set -euo pipefail
        echo "→ comparing the toolkit's vendored copies against $ERPLORA_HUB_DIR"
        cd "$ERPLORA_TOOLKIT"
        node --test test/hub-mirror.test.mjs test/canonical-mirrors.test.mjs
